<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>복제인간 시 Chapter 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
/* layout: 화면 전체가 장면. 풍경은 흑백 글자로만('논', '새'), 마네킹만 3D.
   대사는 장면 아래쪽에 떠서 쌓인다. 낮=흰 바탕 검은 글씨, 밤=검은 바탕 흰 글씨 */
:root{
  --bg:rgb(255,255,255);
  --ink:rgb(0,0,0);
  --bgA:rgba(255,255,255,0);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --fs:17px;
  color-scheme:light;
}
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
#app{touch-action:pan-y;position:relative;width:100%;height:100%;height:100dvh;max-width:560px;margin:0 auto;overflow:hidden;background:var(--bg)}
.halo{text-shadow:0 0 2px var(--bg),0 0 4px var(--bg),0 0 8px var(--bg),0 0 14px var(--bg),0 0 22px var(--bg)}

#title{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;
  padding-block:0 calc(48px + env(safe-area-inset-bottom,0px));
  padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));
  background:linear-gradient(to top,var(--bg) 0%,var(--bg) 22%,var(--bgA) 52%);cursor:pointer;transition:opacity 1.6s ease}
#title.gone{opacity:0;pointer-events:none}
.eyebrow{font-size:12px;letter-spacing:.3em;opacity:.55}
#titleBtn{align-self:flex-start;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;
  font:500 clamp(34px,10vw,46px)/1.15 var(--font);letter-spacing:-.02em;text-align:left}
#titleBtn:focus-visible{outline:1px solid var(--ink);outline-offset:6px}
.titleSub{font-size:14px;line-height:1.7;opacity:.7;max-width:30ch;word-break:keep-all}
.tapStart{margin-top:20px;font-size:12px;letter-spacing:.2em;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.85}}

#game{position:absolute;inset:0}
#scene{position:absolute;inset:0;overflow:hidden;touch-action:none}
#scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{pointer-events:none}
#sky{position:absolute;left:0;right:0;top:0;height:26%}
#birdsCv{pointer-events:none}

/* 대사: 상단 중앙 */
#talk{position:absolute;top:0;left:0;right:0;z-index:6;text-align:center;pointer-events:none;
  padding:calc(58px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 46px max(24px,env(safe-area-inset-left,0px));
  font-size:var(--fs);line-height:1.65;display:flex;flex-direction:column;align-items:center;gap:14px;
  background:linear-gradient(to bottom,var(--bg) 0%,var(--bg) 70%,var(--bgA) 100%)}
#talk:empty{display:none}
#talk{max-height:calc(100% - 80px);overflow-y:auto;pointer-events:auto;touch-action:pan-y;scrollbar-width:none}
#talk::-webkit-scrollbar{display:none}
#game:has(#choices:not([hidden])) #talk{max-height:46%}
@media(max-height:500px){#talk{padding-top:calc(46px + env(safe-area-inset-top,0px));padding-bottom:18px;gap:8px}#choices{padding-top:16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
.tb{min-width:0;max-width:100%;animation:in .6s ease both;width:min(86vw,520px);flex:none;display:flex;flex-direction:column;align-items:center;gap:5px}
.who{font-size:11px;letter-spacing:.3em;opacity:.5;margin-bottom:2px}
.tl{width:100%;overflow-wrap:anywhere;word-break:keep-all;white-space:pre-line;text-align:center;animation:in .6s ease both}
.tb.mq .tl{font-weight:500}
.tb.me .tl{opacity:.78}
#choices{position:absolute;left:0;right:0;bottom:0;z-index:7;display:flex;flex-direction:column;align-items:center;gap:8px;
  max-height:54%;overflow-y:auto;padding-block:44px calc(26px + env(safe-area-inset-bottom,0px));
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  background:linear-gradient(to top,var(--bg) 0%,var(--bg) 72%,var(--bgA) 100%);scrollbar-width:none}
#choices::-webkit-scrollbar{display:none}
.choiceLabel{font-size:11px;letter-spacing:.3em;opacity:.5;margin-bottom:2px}
.choice{background:var(--bg);color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:7px 16px;
  font:400 14px/1.45 var(--font);cursor:pointer;max-width:100%;word-break:keep-all;text-align:center;animation:in .5s ease both}
.choice:hover,.choice:focus-visible{background:var(--ink);color:var(--bg);outline:none}
#game.talking #panel{opacity:0;pointer-events:none}

/* 마지막: 새들이 화면을 덮은 뒤의 검은 화면 */
#finale{position:absolute;inset:0;z-index:30;background:#000;color:#fff;opacity:0;transition:opacity 1.6s ease;
  display:flex;flex-direction:column;justify-content:center;gap:14px;overflow-y:auto;
  padding-block:calc(40px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
#finale.on{opacity:1}
.echoSay{position:absolute;z-index:4;background:none;border:0;padding:8px;margin:0;color:var(--ink);font-family:var(--font);letter-spacing:.06em;cursor:pointer;opacity:0;animation:echoFade 4.6s ease forwards;white-space:nowrap}
@keyframes echoFade{0%{opacity:0}15%{opacity:1}70%{opacity:.9}100%{opacity:0}}
#finale .route{background:#000;color:#fff;border-color:#fff}
#finale .route:hover,#finale .route:focus-visible{background:#fff;color:#000}
#finale .ln{font-size:14px;opacity:.75}

#mq{position:absolute;left:0;top:0;width:0;height:0;cursor:pointer}
#scene.shake canvas{animation:shake .5s}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-6px 2px}40%{translate:5px -2px}60%{translate:-3px 1px}80%{translate:2px 0}}

.breath{position:absolute;transform:translate(-50%,-50%);font-size:15px;line-height:1;color:var(--ink);opacity:0;
  transition:opacity .35s;pointer-events:none;white-space:nowrap}
.breath.on{opacity:1}
.breath.fade{opacity:0;transition:opacity 1.3s}
.breath.last{font-size:22px;pointer-events:auto;cursor:pointer;padding:10px}
.breath.wanted{animation:pulse 1.4s ease-in-out infinite}
.bug{position:absolute;font-size:12px;color:var(--ink);opacity:0;pointer-events:none;animation:chirp 3.6s ease-in-out infinite}
@keyframes chirp{0%,100%{opacity:0}45%,60%{opacity:.75}}

#hint{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;
  font-size:12px;letter-spacing:.08em;color:var(--ink);background:var(--bg);border:1px solid var(--ink);border-radius:999px;padding:5px 12px;
  white-space:normal;max-width:calc(100% - 32px);text-align:center;overflow-wrap:anywhere;pointer-events:none;transition:opacity .6s}
#hint:empty{opacity:0}

#tools{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:center;z-index:40}
.tool{background:var(--bg);color:var(--ink);border:1px solid var(--ink);border-radius:999px;font:500 12px var(--font);padding:5px 10px;cursor:pointer}
.tool.on{background:var(--ink);color:var(--bg)}
#tools{flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
.tool:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#tools{align-items:flex-start}
#menuBtn{width:34px;height:34px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#menuBtn span{display:block;width:14px;height:1px;background:currentColor}
#menuPanel{max-width:calc(100vw - 28px);max-height:calc(100svh - 70px);overflow:auto;display:flex;flex-direction:column;gap:10px;background:var(--bg);color:var(--ink);border:1px solid var(--ink);border-radius:14px;padding:12px 14px;font-size:12px}
#menuPanel[hidden]{display:none}
.mrow{display:grid;grid-template-columns:5em minmax(0,1fr) 2.6em;align-items:center;gap:8px}
.mrow input{width:100%;min-width:0;max-width:110px;accent-color:#777}
.mrow span:last-child{text-align:right;font-variant-numeric:tabular-nums}

#panel{position:absolute;left:0;right:0;bottom:0;height:46%;z-index:5;overflow-y:auto;cursor:pointer;
  background:linear-gradient(to top,var(--bg) 0%,var(--bg) 18%,var(--bgA) 100%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26%);mask-image:linear-gradient(to bottom,transparent 0,#000 26%);
  padding-block:30% calc(56px + env(safe-area-inset-bottom,0px));
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  font-size:var(--fs);line-height:1.8;scrollbar-width:none;transition:opacity 1s}
#game.walking #panel{opacity:0;pointer-events:none}
#panel::-webkit-scrollbar{display:none}
.ln{min-width:0;word-break:keep-all;overflow-wrap:anywhere;animation:in .6s ease both}
@keyframes in{from{opacity:0}to{opacity:1}}
.ln.para{margin-top:1em}
.ln.me,.ln.mqL{text-align:center}
.ln.mqL{font-weight:500}
.ln.me{opacity:.72}
.ln.turn{margin-top:1.5em}
.ln.narrStart{margin-top:1.5em}
.blank{height:1.4em}
.err{font-size:.8em;margin-top:.7em;opacity:.6}
#routes{display:flex;flex-wrap:wrap;gap:8px;margin-top:1.6em}
.route{background:var(--bg);color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:5px 12px;font:400 .8em/1.3 var(--font);cursor:pointer}
.route:hover,.route:focus-visible{background:var(--ink);color:var(--bg);outline:none}

@media (pointer:coarse){#app{height:100svh} #tools{max-width:calc(100% - 24px)} .tool,input{touch-action:manipulation}}
@media (prefers-reduced-motion:reduce){.bird,.bug,.tapStart,.breath.wanted{animation:none}#scene.shake canvas{animation:none}}
</style>

<div id="app">
  <section id="game" class="walking">
    <div id="scene">
      <canvas id="field"></canvas>
      <canvas id="gl"></canvas>
      <div id="sky" data-hit="birds"></div>
      <canvas id="birdsCv" aria-hidden="true"></canvas>
      <div id="mq" data-hit="mannequin" role="img" aria-label="마네킹"></div>
      <div id="hint" class="halo"></div>
    </div>
    <div id="panel" class="halo" data-hit="panel" aria-live="polite" hidden></div>
    <div id="talk" class="halo" aria-live="polite"></div>
    <div id="choices" hidden></div>
  </section>
      <div id="tools">
        <div id="menuPanel" hidden>
          <label class="mrow"><span>글자 크기</span><input id="fsRange" type="range" min="13" max="26" step="1" value="17"><span id="fsVal">17</span></label>
          <label class="mrow"><span>화면 확대</span><input id="zoomRange" type="range" min="0.7" max="3" step="0.1" value="1"><span id="zoomVal">1.0×</span></label>
          <button class="tool" id="resetViewBtn" type="button">화면 확대 원래대로</button>
          <button class="tool" id="lockBtn" type="button" aria-pressed="false">위아래 고정하기</button>
        </div>
        <button class="tool" id="menuBtn" type="button" aria-label="설정" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
  <section id="finale" hidden><div id="routesWrap"></div></section>

  <section id="title" aria-label="챕터 타이틀">
    <div class="eyebrow">복제인간 시 · CHAPTER 1</div>
    <button id="titleBtn" type="button">계단식 논에서</button>
    <div class="titleSub">논두렁을 따라 걸어가세요. 한 가운데에 누군가 기다리고 있습니다.</div>
    <div class="tapStart">화면을 눌러 시작</div>
  </section>
</div>

<script src="public/qa-core.js"></script>
<script src="public/qa-client.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const scene=$("#scene"), panel=$("#panel"), mqHit=$("#mq"), hint=$("#hint"), game=$("#game"), root=document.documentElement;
function noise(n){const x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x);}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const rgb=(c,a)=>a===undefined?"rgb("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+")":"rgba("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+","+a+")";
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
function shake(){scene.classList.remove("shake");void scene.offsetWidth;scene.classList.add("shake");setTimeout(()=>scene.classList.remove("shake"),520);}
// Touch devices use a smaller drawing buffer; layout remains in CSS pixels.
const mobileGraphics=matchMedia('(pointer: coarse)').matches;
const renderDpr=()=>Math.min(mobileGraphics?1.5:2,window.devicePixelRatio||1);
let glWidth=0, glHeight=0, glDpr=0;
const FONT='"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",sans-serif';

/* ---------- 낮(흰 바탕 검은 글씨) ↔ 밤(검은 바탕 흰 글씨) ---------- */
let nt=0, ntTarget=0, ntDrawn=-1, ntCss=-1;
const bgC=()=>mix([255,255,255],[0,0,0],nt), inkC=()=>mix([0,0,0],[255,255,255],nt);
function syncCss(){
  if(Math.abs(nt-ntCss)<.004) return; ntCss=nt;
  const b=bgC(), k=inkC();
  root.style.setProperty("--bg",rgb(b)); root.style.setProperty("--bgA",rgb(b,0)); root.style.setProperty("--ink",rgb(k));
}

/* ---------- 세계 ---------- */
const cam={x:0,z:0,y:1.6,yaw:0,pitch:0,phase:0};
const MQ={x:0,z:34};
const T=5.5;
let started=false, walking=true, moving=false, turnV=0, arrivedAt=0, lastT=0, lastR=0, downX=null, overhead=false;
/* 장(章) 상태: 1 = 계단식 논에서, 2 = 묘지산에서 */
let CH=1, GLY="논", SUMMIT=1e9, rotR=0, rotOn=false, cmDirty=false, cryOn=false, timers=[];
const SHZ=29, figHead={x:0,y:0};
const later=(fn,ms)=>{const id=setTimeout(fn,ms); timers.push(id); return id;};
function clearTimers(){ timers.forEach(id=>{clearTimeout(id);clearInterval(id);}); timers=[]; }

/* 논 농도 지도: 1 = 진한 글자(논두렁), 낮을수록 옅은 글자 */
const CM_S=8, CM_OX=20, CM_OZ=6, CM_W=40*CM_S, CM_H=76*CM_S;
const tone=new Float32Array(CM_W*CM_H);
(function(){
  for(let py=0;py<CM_H;py++){const Z=py/CM_S-CM_OZ;
    for(let px=0;px<CM_W;px++){const X=px/CM_S-CM_OX; let t;
      const f=(Z+Math.sin(X*.18)*1.1+2)/T, b=Math.floor(f);
      if(Math.abs(X)<.3) t=.9;
      else if((f-b)*T<.36) t=1;
      else{
        const off=noise(b*13+5)*7.5, q=(X+off+300)/7.5, fi=Math.floor(q);
        if((q-fi)*7.5<.3) t=1;
        else{ const s=noise(b*47+fi+900); t= s<.4?.12 : s<.7?.34:.22;
          if(s>=.4 && (((Z*4+s*10)%1)+1)%1<.42) t*=.55; }
      }
      tone[py*CM_W+px]=t;
    }}
})();
/* 묘지산 농도 지도: 꼭대기까지 오르는 길, 봉분(둥근 무덤)과 비석, 꼭대기의 빈 마당 */
let tone2=null;
function buildTone2(){
  tone2=new Float32Array(CM_W*CM_H);
  const mounds={};
  for(let cz=-2;cz<12;cz++)for(let cx=-7;cx<7;cx++){
    const h=noise(cx*31.7+cz*7.3+5); if(h<.3) continue;
    const mx=cx*3+1.5+(noise(cx*3.1+cz*9.7)-.5)*1.2, mz=cz*3+1.5+(noise(cx*5.9+cz*2.3)-.5)*1.2, r=.75+noise(cx+cz*13)*.65;
    const px=Math.sin(mz*.22)*1.8*(1-clamp((mz-22)/6,0,1));
    if(Math.abs(mx-px)<r+1.1 || Math.hypot(mx,mz-SHZ)<4.6 || mz>33-r) continue;
    (mounds[cx+","+cz]=[mx,mz,r]);
  }
  for(let py=0;py<CM_H;py++){const Z=py/CM_S-CM_OZ;
    for(let px=0;px<CM_W;px++){const X=px/CM_S-CM_OX; let t=.13+noise(X*7.1+Z*3.3)*.07;
      const pathX=Math.sin(Z*.22)*1.8*(1-clamp((Z-22)/6,0,1)), dp=Math.abs(X-pathX);
      if(dp<.42) t=.04; else if(dp<.56) t=.5;
      const dr=Math.hypot(X,Z-SHZ);
      if(dr<3.6) t=.06; else if(dr<3.78) t=.55;
      const gx=Math.floor(X/3), gz=Math.floor(Z/3);
      for(let ax=-1;ax<=1;ax++)for(let az=-1;az<=1;az++){ const m=mounds[(gx+ax)+","+(gz+az)]; if(!m) continue; const [mx,mz,r]=m;
        const dx=X-mx, dz=Z-mz;
        if(Math.abs(dx)<.16 && dz<-r+.06 && dz>-r-.3){ t=1; continue; }
        const d=Math.hypot(dx,dz)/r; if(d>=1) continue;
        t= d>.9 ? .95 : clamp(.22+.48*(1-d*d)-.28*(dx/r),.08,.9);
      }
      tone2[py*CM_W+px]=t;
    }}
}
/* 임도 농도 지도: 숲 사이로 구불구불 올라가는 흙길(바퀴 자국 두 줄), 길 양옆은 빽빽한 숲 */
let tone3=null;
const roadX=Z=>Math.sin(Z*.15)*2.2;
function buildTone3(){
  tone3=new Float32Array(CM_W*CM_H);
  for(let py=0;py<CM_H;py++){const Z=py/CM_S-CM_OZ;
    for(let px=0;px<CM_W;px++){const X=px/CM_S-CM_OX; let t;
      const d=Math.abs(X-roadX(Z));
      if(d<1.15){ t=.05+noise(X*5.3+Z*2.1)*.05; if(Math.abs(d-.55)<.11) t=.32; }
      else if(d<1.32) t=.6;
      else{
        const n=.5+.5*Math.sin(X*1.3+Math.sin(Z*.7)*2)*Math.sin(Z*1.1+Math.cos(X*.5)*2);
        t=.56+.36*n+noise(X*9.7+Z*4.1)*.08;
        const gx=Math.floor(X*.9), gz=Math.floor(Z*.9);
        if(noise(gx*7.3+gz*13.1)>.72){ const cx=(gx+.5)/.9, cz=(gz+.5)/.9; if(Math.hypot(X-cx,Z-cz)<.16) t=1; }
      }
      tone3[py*CM_W+px]=clamp(t,0,1);
    }}
}
const cmap=document.createElement("canvas"); cmap.width=CM_W; cmap.height=CM_H;
function buildCmap(){
  const src=CH===5&&tone5?tone5:CH===4&&tone4?tone4:CH===2&&tone2?tone2:CH===3&&tone3?tone3:tone, Hh=src.length/CM_W;
  if(cmap.height!==Hh) cmap.height=Hh;
  const g=cmap.getContext("2d"), id=g.createImageData(CM_W,Hh), d=id.data, b=bgC(), k=inkC();
  for(let i=0;i<src.length;i++){const t=src[i],o=i*4; d[o]=b[0]+(k[0]-b[0])*t; d[o+1]=b[1]+(k[1]-b[1])*t; d[o+2]=b[2]+(k[2]-b[2])*t; d[o+3]=255;}
  if(CH===2 && rotR>0){
    /* 인간이 밟고 선 잡초 뿌리가 썩고 흙이 검게 변한다: 발밑에서부터 번지는 검은 글자 */
    const x0=Math.max(0,Math.floor((-rotR+CM_OX)*CM_S)), x1=Math.min(CM_W-1,Math.ceil((rotR+CM_OX)*CM_S));
    const y0=Math.max(0,Math.floor((SHZ-rotR+CM_OZ)*CM_S)), y1=Math.min(CM_H-1,Math.ceil((SHZ+rotR+CM_OZ)*CM_S));
    for(let py=y0;py<=y1;py++)for(let px=x0;px<=x1;px++){
      const X=px/CM_S-CM_OX, Z=py/CM_S-CM_OZ, dd=Math.hypot(X,Z-SHZ)*(1+.25*Math.sin(Math.atan2(X,Z-SHZ)*5));
      if(dd>=rotR) continue;

function startCruise(){
  const W=scene.clientWidth, H=scene.clientHeight; birds=[];
  for(let k=0;k<16;k++) birds.push({x:-30-noise(k+1)*W*.9,y:H*(.05+noise(k+2)*.16),vx:36+noise(k+3)*34,vy:0,s:9+noise(k+4)*6,ph:noise(k+5)*6.28,ox:(noise(k+6)-.5)*90,oy:(noise(k+7)-.5)*44});

function updateBirds(dt,ts){
  const W=scene.clientWidth, H=scene.clientHeight;
  birdA+=(birdAT-birdA)*Math.min(1,dt*1.6);
  if(birdMode==="cruise"){
    birds.forEach(b=>{ b.x+=b.vx*dt; b.y+=Math.sin(ts*1.3+b.ph)*6*dt; if(b.x>W+30) b.x=-30-noise(b.ph*9)*90; });

    birds.forEach(b=>{
      const tx=flock.x+b.ox+Math.sin(ts*1.7+b.ph)*16, ty=flock.y+b.oy+Math.cos(ts*1.4+b.ph)*10;
      b.vx+=((tx-b.x)*4.4-b.vx*2.3)*dt; b.vy+=((ty-b.y)*4.4-b.vy*2.3)*dt;
      b.x+=b.vx*dt; b.y+=b.vy*dt;
    });
  } else if(birdMode==="leave"){
    birds.forEach(b=>{ b.vx+=(110+b.ph*12)*dt; b.vy-=40*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; });

    for(let k=0;k<n;k++){
      const e=Math.floor(Math.random()*4), r=Math.random();
      let x,y; if(e===0){x=r*W;y=-40;} else if(e===1){x=W+40;y=r*H;} else if(e===2){x=r*W;y=H+40;} else {x=-40;y=r*H;}
      const tx=W*(.1+Math.random()*.8), ty=H*(.1+Math.random()*.8), ang=Math.atan2(ty-y,tx-x)+(Math.random()-.5)*1.1, sp=80+Math.random()*230;
